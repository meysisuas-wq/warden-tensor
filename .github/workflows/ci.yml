name: WardenTensor CI
on:
  push: {branches: [main, develop]}
  pull_request: {branches: [main]}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: {matrix: {python-version: ["3.11", "3.12"]}}
    services:
      postgres:
        image: postgres:15
        env: {POSTGRES_DB: wardentensor_test, POSTGRES_USER: warden, POSTGRES_PASSWORD: test}
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: pip install -r requirements.txt
      - name: Tests
        env: {DATABASE_URL: "postgresql+asyncpg://warden:test@localhost:5432/wardentensor_test", REDIS_URL: "redis://localhost:6379/0"}
        run: pytest tests/ -v --cov=src
